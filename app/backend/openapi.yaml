openapi: 3.1.0
info:
  title: zcrypt API
  description: >
    Zero-knowledge encrypted cloud storage API. This is a curated subset of the
    surface: the backend also serves folders, shares, folder-shares, shared
    vaults, Send, pads, notes, clipboard, snapshots, integrity, sync/offline, the
    dead-man's switch, and decoy mode. See app/backend/cmd/server.go
    (RegisterRoutes) for the authoritative list.
  version: 0.3.0

servers:
  - url: http://localhost:8080
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    FileMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
        original_size:
          type: integer
        compressed_size:
          type: integer
        encrypted_size:
          type: integer
        chunk_count:
          type: integer
        sha256:
          type: string
        status:
          type: string
          enum: [uploading, complete]
        created_at:
          type: string
          format: date-time
    PlatformStatus:
      type: object
      properties:
        platform:
          type: string
        username:
          type: string
        connected:
          type: boolean
    RepoInfo:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
        name:
          type: string
        url:
          type: string
        used_bytes:
          type: integer
        max_bytes:
          type: integer
        active:
          type: boolean
    QuotaInfo:
      type: object
      properties:
        used_bytes:
          type: integer
        quota_bytes:
          type: integer
        max_concurrent_uploads:
          type: integer
        plan:
          type: string
        relay_used_bytes:
          type: integer
          description: Bytes moved through the server this UTC month
        relay_limit_bytes:
          type: integer
          description: Monthly allowance for transfers through the server, 0 means unlimited
        relay_max_file_bytes:
          type: integer
          description: Largest file a web upload through the server may carry, 0 means unlimited
        relay_resets_at:
          type: string
          format: date-time
          description: Start of next UTC month
        relay_day_used_bytes:
          type: integer
          description: Bytes moved through the server today (UTC)
        relay_day_limit_bytes:
          type: integer
          description: Daily allowance, 0 means none
        relay_day_resets_at:
          type: string
          format: date-time
          description: Next UTC midnight
        relay_reserved_bytes:
          type: integer
          description: >
            Bytes in-flight server uploads still promise to send. Already counted
            against both windows; remaining = limit - used - reserved.
    RelayRefusal:
      type: object
      description: >
        A transfer through the server does not fit the allowance. Public link
        and Send downloads omit used_bytes and limit_bytes (they are the
        owner's figures).
      properties:
        error: { type: string }
        code:
          type: string
          enum: [relay_file_too_large, relay_allowance_exceeded, relay_daily_exceeded, relay_chunk_exceeds_declared]
        limit_bytes: { type: integer }
        used_bytes: { type: integer }
        resets_at: { type: string, format: date-time }
    CodedError:
      type: object
      properties:
        error: { type: string }
        code: { type: string }

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Account created
        "400":
          description: Validation error
        "429":
          description: Rate limited

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful (or 2FA challenge)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  requires_2fa:
                    type: boolean
                  challenge_token:
                    type: string
        "401":
          description: Invalid credentials
        "429":
          description: Rate limited

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New tokens issued

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Logged out

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Reset email sent (always returns 200)

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Password reset

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified

  /api/auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Generate TOTP secret
      responses:
        "200":
          description: TOTP setup info
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  uri:
                    type: string

  /api/auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable 2FA with verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: 2FA enabled

  /api/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Verification email sent (always returns 200)

  /api/auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: 2FA disabled

  /api/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify 2FA code during login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: 2FA verified, tokens issued

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user info
    delete:
      tags: [Auth]
      summary: Schedule the caller's account for deletion
      description: >
        Re-verifies the caller, then schedules permanent deletion 7 days out and
        signs every device out. Signing back in and calling
        `/api/auth/me/deletion/cancel` before then keeps the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                code: { type: string, description: "TOTP code, required when 2FA is on" }
      responses:
        "200":
          description: Deletion scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletion_scheduled_at: { type: string, format: date-time }
        "401":
          description: Re-authentication failed
        "429":
          description: Too many attempts

  /api/auth/me/deletion/cancel:
    post:
      tags: [Auth]
      summary: Keep an account that is scheduled for deletion
      responses:
        "200":
          description: Deletion cancelled
        "404":
          description: No deletion is scheduled

  /api/auth/me/export:
    get:
      tags: [Auth]
      summary: Download everything stored about the account as JSON
      responses:
        "200":
          description: Account export (attachment)

  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List signed-in devices
      responses:
        "200":
          description: One entry per sign-in session, `current` marks the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    ip: { type: string }
                    user_agent: { type: string }
                    started_at: { type: string, format: date-time }
                    last_active: { type: string, format: date-time }
                    expires_at: { type: string, format: date-time }
                    current: { type: boolean }

  /api/auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Sign one device out
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Session revoked
        "404":
          description: No such session for this account

  /api/auth/sessions/revoke-others:
    post:
      tags: [Auth]
      summary: Sign out every device except the caller
      responses:
        "200":
          description: Number of sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }

  /api/upload/init:
    post:
      tags: [Upload]
      summary: Start a resumable upload session
      description: >
        Chunks are encrypted client-side before upload. Send either a plaintext
        `filename` or an opaque `encrypted_name` (zero-knowledge).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_size, sha256, salt, chunk_count]
              properties:
                filename: { type: string }
                encrypted_name: { type: string }
                original_size: { type: integer, format: int64 }
                sha256: { type: string }
                sha256_scheme: { type: string }
                salt: { type: string }
                wrapped_cek: { type: string }
                chunk_count: { type: integer }
                chunk_size: { type: integer }
                platform: { type: string }
                folder_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Session created (returns session_id, file_id, platform, direct_upload)
        "403":
          description: >
            Transfer allowance exceeded. `code` is `relay_daily_exceeded` or
            `relay_allowance_exceeded`; in-flight uploads reserve their
            declared size against both windows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }
        "413":
          description: >
            File too large (`relay_file_too_large`) or shared storage full.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }

  /api/upload/{sid}/presign/{idx}:
    post:
      tags: [Upload]
      summary: Presign a direct-upload chunk (HuggingFace LFS)
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Presigned upload URL + headers

  /api/upload/{sid}/chunk/{idx}:
    put:
      tags: [Upload]
      summary: Relay-upload an encrypted chunk
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Chunk stored
        "403":
          description: Allowance exhausted mid-transfer (`relay_daily_exceeded` / `relay_allowance_exceeded`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }
        "413":
          description: Chunk would take the file past its declared size (`relay_chunk_exceeds_declared`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }

  /api/upload/{sid}/confirm/{idx}:
    post:
      tags: [Upload]
      summary: Confirm a direct-uploaded chunk
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Chunk confirmed

  /api/upload/{sid}/complete:
    post:
      tags: [Upload]
      summary: Finalize the upload session
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Upload complete

  /api/upload/{sid}/status:
    get:
      tags: [Upload]
      summary: Uploaded-chunk set for a session (for resume)
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Session status + uploaded_chunks

  /api/upload/{sid}:
    delete:
      tags: [Upload]
      summary: Cancel a session
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Session cancelled

  /api/upload/incomplete:
    get:
      tags: [Upload]
      summary: List resumable (incomplete) sessions
      responses:
        "200":
          description: Incomplete sessions

  /api/files:
    get:
      tags: [Files]
      summary: List files
      parameters:
        - name: filter
          in: query
          schema:
            type: string
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileMetadata"

  /api/files/trash:
    get:
      tags: [Files]
      summary: List trashed files
      responses:
        "200":
          description: Trashed file list

  /api/files/{id}/meta:
    get:
      tags: [Files]
      summary: File metadata (chunk count, salt, wrapped CEK, sizes)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: File metadata

  /api/files/{id}/chunks/{idx}:
    get:
      tags: [Files]
      summary: Fetch one encrypted chunk
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Encrypted chunk bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: >
            Serving the chunk would exceed the daily or monthly transfer
            allowance (`relay_daily_exceeded` / `relay_allowance_exceeded`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }

  /api/files/{id}:
    delete:
      tags: [Files]
      summary: Move file to trash
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: File moved to trash

  /api/files/{id}/purge:
    delete:
      tags: [Files]
      summary: Permanently delete a file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: File permanently deleted

  /api/platforms/status:
    get:
      tags: [Platforms]
      summary: Platform connection status
      responses:
        "200":
          description: Platform statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformStatus"

  /api/platforms/connect:
    post:
      tags: [Platforms]
      summary: Connect platform token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [github, gitlab, huggingface]
                token:
                  type: string
      responses:
        "200":
          description: Platform connected

  /api/platforms/disconnect:
    delete:
      tags: [Platforms]
      summary: Disconnect platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, username]
              properties:
                platform:
                  type: string
                username:
                  type: string
      responses:
        "200":
          description: Platform disconnected

  /api/repos:
    get:
      tags: [Platforms]
      summary: List repos
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepoInfo"

  /api/events:
    get:
      tags: [Realtime]
      summary: SSE progress stream
      parameters:
        - name: token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/quota:
    get:
      tags: [Quota]
      summary: Get user quota
      responses:
        "200":
          description: Quota info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaInfo"

  /api/config:
    get:
      tags: [Config]
      summary: Get app config
      responses:
        "200":
          description: App configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration_enabled:
                    type: boolean
                  default_platform:
                    type: string
    put:
      tags: [Config]
      summary: Update app config (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_enabled:
                  type: boolean
                default_platform:
                  type: string
      responses:
        "200":
          description: Config updated

  /api/health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List all users
      responses:
        "200":
          description: User list

  /api/admin/users/{id}/role:
    put:
      tags: [Admin]
      summary: Set user role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, admin]
      responses:
        "200":
          description: Role updated

  /api/admin/users/{id}/plan:
    put:
      tags: [Admin]
      summary: Set user plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [free, pro]
      responses:
        "200":
          description: Plan updated

  /api/admin/users/{id}/quota:
    put:
      tags: [Admin]
      summary: Set user storage quota
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quota_bytes:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Quota updated

  /api/admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted

  /api/admin/stats:
    get:
      tags: [Admin]
      summary: System statistics
      responses:
        "200":
          description: System stats

  /api/admin/tokens:
    get:
      tags: [Admin]
      summary: List the calling admin's own platform tokens plus a count of other users' tokens
      responses:
        "200":
          description: Object with tokens (own, metadata only) and others_count
    post:
      tags: [Admin]
      summary: Create platform token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token, is_global]
              properties:
                user_id:
                  type: string
                platform:
                  type: string
                token:
                  type: string
                is_global:
                  type: boolean
      responses:
        "200":
          description: Token created

  /api/admin/tokens/{id}:
    delete:
      tags: [Admin]
      summary: Delete one of the calling admin's own platform tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token deleted

  /api/admin/quota:
    get:
      tags: [Admin]
      summary: Get default quota
      responses:
        "200":
          description: Default quota
    put:
      tags: [Admin]
      summary: Set default quota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [default_quota_bytes]
              properties:
                default_quota_bytes:
                  type: integer
      responses:
        "200":
          description: Default quota updated

  /api/shares:
    get:
      tags: [Shares]
      summary: List the caller's file links
      responses:
        "200":
          description: Links
    post:
      tags: [Shares]
      summary: Create a public link to a file
      description: The file key is wrapped under a link key that stays in the URL fragment.
      responses:
        "201":
          description: Link created
        "428":
          description: >
            A burst of public links: send a Cloudflare Turnstile token in
            `X-Turnstile-Token` and repeat (`challenge_required`). Only when
            Turnstile is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
        "429":
          description: The same burst from the desktop or Android app (`share_limit`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }

  /api/shares/{id}:
    delete:
      tags: [Shares]
      summary: Revoke a file link
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Revoked

  /api/share/{token}:
    get:
      tags: [Shares]
      summary: Public link info (no account)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Link info
        "404":
          description: Unknown, revoked or expired

  /api/share/{token}/meta:
    get:
      tags: [Shares]
      summary: Public link file metadata (sealed name, sizes, wrapped key)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Metadata

  /api/share/{token}/chunks/{idx}:
    get:
      tags: [Shares]
      summary: Download one encrypted chunk of a public link
      description: Charged to the owner's transfer allowance.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Encrypted chunk (X-Chunk-SHA256, X-Chunk-Compressed)
        "403":
          description: The owner's transfer allowance is used up (`used_bytes` and `limit_bytes` are omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }

  /api/share/{token}/complete:
    post:
      tags: [Shares]
      summary: Count one finished download of a file link
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Counted

  /api/folder-shares:
    get:
      tags: [Folder shares]
      summary: List the caller's folder links
      responses:
        "200":
          description: Links
    post:
      tags: [Folder shares]
      summary: Create a public link to a folder
      responses:
        "201":
          description: Link created
        "428":
          description: >
            A burst of public links: send a Cloudflare Turnstile token in
            `X-Turnstile-Token` and repeat (`challenge_required`). Only when
            Turnstile is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
        "429":
          description: The same burst from the desktop or Android app (`share_limit`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }

  /api/folder-shares/{id}:
    delete:
      tags: [Folder shares]
      summary: Revoke a folder link
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Revoked

  /api/folder-share/{token}:
    get:
      tags: [Folder shares]
      summary: Public folder link listing (password-protected links need X-Folder-Password)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Folder and files

  /api/folder-share/{token}/files/{fid}/meta:
    get:
      tags: [Folder shares]
      summary: Metadata of one file in a folder link
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Metadata

  /api/folder-share/{token}/files/{fid}/chunks/{idx}:
    get:
      tags: [Folder shares]
      summary: Download one encrypted chunk of a file in a folder link
      description: Charged to the owner's transfer allowance.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Encrypted chunk (X-Chunk-SHA256, X-Chunk-Compressed)
        "403":
          description: The owner's transfer allowance is used up (`used_bytes` and `limit_bytes` are omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }

  /api/folder-share/{token}/files/{fid}/complete:
    post:
      tags: [Folder shares]
      summary: Count one finished file download from a folder link
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Counted

  /api/send/init:
    post:
      tags: [Send]
      summary: Start a Send (account optional)
      security: []
      responses:
        "200":
          description: Session created (session_id, token)
        "429":
          description: >
            Daily Send allowance used up. `login_required` is true when signing
            in raises it.

  /api/send/{sid}/chunk/{idx}:
    put:
      tags: [Send]
      summary: Upload one encrypted chunk of a Send
      security: []
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Chunk stored
        "413":
          description: More bytes than declared (`relay_chunk_exceeds_declared`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }

  /api/send/{sid}/complete:
    post:
      tags: [Send]
      summary: Finish a Send
      description: Idempotent. A repeat of a finished Send answers with the same token.
      security: []
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Finished (token)
        "400":
          description: Chunks missing, or the session was cancelled

  /api/send/{sid}:
    delete:
      tags: [Send]
      summary: Cancel an unfinished Send and delete its stored chunks
      security: []
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Cancelled
        "404":
          description: Unknown session
        "409":
          description: Already finished

  /api/send/{token}:
    get:
      tags: [Send]
      summary: Public Send info
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Send info

  /api/send/{token}/meta:
    get:
      tags: [Send]
      summary: Public Send file metadata
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Metadata

  /api/send/{token}/chunks/{idx}:
    get:
      tags: [Send]
      summary: Download one encrypted chunk of a Send
      description: A signed-in sender's Send is charged to their transfer allowance.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Encrypted chunk (X-Chunk-SHA256, X-Chunk-Compressed)
        "403":
          description: The owner's transfer allowance is used up (`used_bytes` and `limit_bytes` are omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRefusal" }

  /api/shared-vaults/{id}/rotate:
    post:
      tags: [Spaces]
      summary: Re-key a Space (owner or admin)
      description: >
        A new Space key sealed to every member and every file key re-wrapped
        under it. `key_generation` is the generation the client rotated from;
        the Space's generation goes up by one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Rotated
        "409":
          description: >
            `stale_space_key` (another device rotated first: reload the Space
            and retry) or the rotation does not cover every member and file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
