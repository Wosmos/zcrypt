name: Release

on:
  push:
    tags:
      - "v*"

# Each version tag is its own ref/group, so this only matters if the same tag
# is re-pushed (e.g. a deleted+recreated tag): cancels the stale build for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main. Merge to main first, then tag."
            exit 1
          fi

      - name: Versions must match
        run: bash scripts/check-versions.sh

  create-release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a changelog entry for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          date="$(jq -r --arg v "$version" 'map(select(.version == $v)) | first | .date // empty' app/frontend/lib/changelog.json)"
          if [ -z "$date" ]; then
            echo "::error::$TAG has no dated entry in app/frontend/lib/changelog.json. Write the changelog (all 8 languages) and set its date before releasing."
            exit 1
          fi
          echo "changelog entry for $version dated $date"

      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            echo "release $TAG already exists"
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          bash scripts/release-notes.sh "$TAG" > release-notes.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file release-notes.txt --draft $prerelease

  changelog:
    name: Update CHANGELOG.md
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Generate CHANGELOG.md from conventional commits
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no changelog changes"
          else
            git commit -m "docs: update changelog for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
