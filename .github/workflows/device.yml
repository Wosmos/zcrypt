name: Desktop & Android Build

on:
  push:
    branches: [main, convert-to-tauri]
    paths:
      - "app/desktop/**"
      # zcrypt-core is compiled into both shells (path dependency).
      - "app/core/**"
      - ".github/workflows/device.yml"
      # Intentionally NOT "app/frontend/**": a frontend-only commit no longer
      # triggers a full multi-platform native rebuild (that was the single
      # biggest compute/queue-time cost in this repo's CI). The bundled UI is
      # refreshed by workflow_dispatch on demand, or automatically on the next
      # desktop/core-relevant change or version tag (tags always rebuild).
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "app/desktop/**"
      - "app/core/**"
      - ".github/workflows/device.yml"
  workflow_dispatch:

# A newer push/PR-update on the same ref makes any run already in flight for
# that ref stale: cancel it instead of burning a full multi-platform bundle
# build on code that's already superseded. Tag pushes are unaffected in the
# normal case (each version tag is its own ref/group); only re-pushing the
# same tag would cancel a stale in-flight release build for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed by the tag-triggered publish steps to upload assets to the release,
# and by the rolling android-latest publish step.
permissions:
  contents: write

# Pinned, not "^2", and the pin is part of the cache key below. `cargo install
# tauri-cli --version "^2"` resolved a floating version into a cache whose key
# had no version component, so the FIRST binary ever cached kept being restored
# forever: a run in 2026 could still be handed a 2024 CLI, with a 2024 Android
# template. Bumping this line both installs and re-caches the new one.
env:
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  # ── Shared: build the static frontend export ONCE ────────────────────────────
  # Desktop and Android used to each build this independently, same Next.js
  # static export, same stripped routes, byte-identical output, which meant
  # every relevant push paid for the full frontend build twice. Built here once
  # and handed to both native build jobs below via artifact.
  build-frontend:
    name: Build frontend static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # This job is now the one hard-serial step every native build waits on
      # (see the comment on build-frontend above), caching install + Next's
      # own build cache shrinks that wait on every run after the first.
      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile

      # next.config.ts sets distDir: ".next-export" for this build mode, so
      # Next's persistent build cache lives at .next-export/cache. Keyed by
      # lockfile + source hash so it invalidates whenever real code changes,
      # while still speeding up recompilation of everything that didn't.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: app/frontend/.next-export/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('app/frontend/bun.lock') }}-${{ hashFiles('app/frontend/**/*.[jt]s', 'app/frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('app/frontend/bun.lock') }}-

      # Remove web-only dynamic routes before static export. Next.js App Router
      # requires generateStaticParams for every [param] route in output:export
      # mode, but these pages (share/pad/send) are web-only and get stripped
      # from frontend-dist anyway. Deleting them pre-build is the only reliable
      # way to skip them in Next.js 16 Turbopack (it can't detect
      # generateStaticParams through a client-component import boundary).
      - name: Remove web-only dynamic routes for native export
        shell: bash
        run: |
          rm -rf app/frontend/app/s
          rm -rf "app/frontend/app/pad/[token]"
          rm -rf "app/frontend/app/send/[token]"
          rm -rf "app/frontend/app/(app)/admin/users/[id]"

      - name: Build frontend
        working-directory: app/frontend
        env:
          NEXT_OUTPUT_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          # Baked into the static export, desktop/mobile have no Next.js
          # rewrites, so they must talk to the live backend directly. Comes
          # from the DESKTOP_API_URL repository VARIABLE (Settings → Secrets
          # and variables → Actions → Variables), never from a checked-in
          # file: the backend host rotates with Railway accounts and a stale
          # committed value shipped an APK pointing at a dead host (v0.1.4).
          NEXT_PUBLIC_API_URL: ${{ vars.DESKTOP_API_URL }}
        run: |
          if [[ -z "$NEXT_PUBLIC_API_URL" ]]; then
            echo "::error::DESKTOP_API_URL repository variable is unset: refusing to bake an empty/localhost backend into a shipped build."
            exit 1
          fi
          echo "baking backend origin: $NEXT_PUBLIC_API_URL"
          bun run build

      - name: Prepare frontend-dist
        shell: bash
        run: |
          rm -rf app/desktop/frontend-dist
          # next.config.ts sets output:"export" + distDir:".next-export", so the
          # static HTML is written directly into .next-export (no nested out/).
          cp -r app/frontend/.next-export app/desktop/frontend-dist

          # Strip marketing-only pages not needed in the native apps
          cd app/desktop/frontend-dist
          rm -rf docs philosophy privacy terms tui pricing pad s send transfer demo features vs
          rm -f sitemap.xml robots.txt opengraph-image* twitter-image*

          # Redirect root → /login
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0;url=/login"></head>
          <body></body>
          </html>
          HTMLEOF

      - name: Upload frontend-dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: app/desktop/frontend-dist
          retention-days: 1

  build-desktop:
    needs: [build-frontend, check-updater-signing]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: target/release/bundle
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle: target/release/bundle
            args: ""
          # Intel macOS is CROSS-COMPILED from the arm64 runner. It used to
          # build natively on macos-13, but GitHub retired that runner: the leg
          # has sat queued and then been cancelled on every run since, which is
          # why no Intel .dmg has ever been published and why /dl/macos-x64 had
          # nothing to resolve to. An explicit --target puts the bundle under
          # target/<triple>/, hence the separate bundle path.
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundle: target/x86_64-apple-darwin/release/bundle
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: target/release/bundle
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # ── System deps (Linux only) ──
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # ── Toolchains ──
      # The engine (zcrypt-core) is pure Rust and compiled into the Tauri shell
      # in-process: the old Go sidecar subprocess is gone.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/desktop/src-tauri
            app/core

      # ── Fast Rust gate (Linux leg only: one leg is enough for lints) ──
      # Runs before the expensive bundle step. src-tauri/build.rs seeds a
      # placeholder frontend-dist when the real export isn't present, so
      # fmt/clippy never need the download-artifact step to have run first.
      # Mirrors the prepush desktop gate (cargo fmt --check + clippy -D
      # warnings; clippy subsumes check).
      - name: Rust lint (fmt + clippy)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: app/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - uses: oven-sh/setup-bun@v2

      - name: Download frontend-dist artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: app/desktop/frontend-dist

      # On tag pushes, stamp the bundle version from the tag (e.g. v0.1.1 →
      # 0.1.1) so installers and the release version match without hand-editing
      # tauri.conf.json. jq is preinstalled on all GitHub-hosted runners.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd app/desktop/src-tauri
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' tauri.conf.json > "$tmp" && mv "$tmp" tauri.conf.json
          echo "tauri version set to $VER"

      # ── Tauri CLI + build ──
      # `cargo install` compiles tauri-cli from source, several minutes, and it
      # was paying that cost on every single run for every matrix leg (the
      # binary isn't portable across OS/arch, so each leg needs its own build).
      # Cache it keyed by OS+arch+major-version: once compiled for a given
      # platform, every later run restores the binary instead of recompiling.
      # Bump the "2" in the key if the version constraint below ever changes.
      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # ── Updater artifact signing (optional, gated on secrets) ──
      # `cargo tauri build` only signs updater bundles (macOS .app.tar.gz,
      # Windows .msi/.exe, Linux .AppImage) when BOTH of these are true:
      #   1. TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) are non-empty here, and
      #   2. app/desktop/src-tauri/tauri.conf.json has `bundle.createUpdaterArtifacts: true`
      #      and a `plugins.updater.pubkey` + `endpoints` configured.
      # Both ARE set up now, which is what makes the step below necessary.
      #
      # With createUpdaterArtifacts on, an EMPTY key is no longer a no-op: tauri
      # tries to sign, fails to parse "" and kills the build with "failed to
      # decode secret key: Missing comment in secret key". GitHub withholds
      # secrets from Dependabot and fork pull requests, so every one of those
      # runs lost all four desktop legs to a signing key they are never allowed
      # to have. Nothing was wrong with the code they were testing.
      #
      # So when no key is available, turn updater artifacts off for that run.
      # The build then produces ordinary unsigned installers and still proves
      # the thing a dependency PR needs proven: that it compiles and bundles.
      # Signed updater artifacts are only ever needed on a real release, which
      # runs on main or a tag and does have the secret.
      - name: Build unsigned when no signing key is available
        if: needs.check-updater-signing.outputs.configured != 'true'
        working-directory: app/desktop/src-tauri
        shell: bash
        run: |
          tmp=$(mktemp)
          jq '.bundle.createUpdaterArtifacts = false' tauri.conf.json > "$tmp"
          mv "$tmp" tauri.conf.json
          echo "no TAURI_SIGNING_PRIVATE_KEY (fork or Dependabot run): updater artifacts disabled for this build"

      - name: Build Tauri app
        working-directory: app/desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build ${{ matrix.args }}

      # Both macOS legs bundle their updater tarball as "zcrypt.app.tar.gz".
      # That was harmless while only arm64 built; now that Intel builds too,
      # the second upload would clobber the first and latest.json would hand
      # both architectures the same URL with different signatures, at most one
      # could ever verify. Name them per target so each arch keeps its own.
      - name: Name the macOS updater bundle per architecture
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          d="app/desktop/src-tauri/${{ matrix.bundle }}/macos"
          shopt -s nullglob
          for f in "$d"/zcrypt.app.tar.gz "$d"/zcrypt.app.tar.gz.sig; do
            base="$(basename "$f")"
            mv "$f" "$d/zcrypt_${{ matrix.target }}.${base#zcrypt.}"
            echo "renamed $base -> zcrypt_${{ matrix.target }}.${base#zcrypt.}"
          done

      # ── Upload artifacts ──
      # .sig globs below only ever match when updater signing is configured
      # (see the "Build Tauri app" step); upload-artifact warns-not-fails on
      # unmatched glob entries as long as at least one path in the list hits.
      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: zcrypt-windows-${{ matrix.target }}
          path: |
            app/desktop/src-tauri/${{ matrix.bundle }}/msi/*.msi
            app/desktop/src-tauri/${{ matrix.bundle }}/msi/*.msi.sig
            app/desktop/src-tauri/${{ matrix.bundle }}/nsis/*.exe
            app/desktop/src-tauri/${{ matrix.bundle }}/nsis/*.exe.sig

      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: zcrypt-macos-${{ matrix.target }}
          path: |
            app/desktop/src-tauri/${{ matrix.bundle }}/dmg/*.dmg
            app/desktop/src-tauri/${{ matrix.bundle }}/macos/*.app.tar.gz
            app/desktop/src-tauri/${{ matrix.bundle }}/macos/*.app.tar.gz.sig

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: zcrypt-linux-${{ matrix.target }}
          path: |
            app/desktop/src-tauri/${{ matrix.bundle }}/deb/*.deb
            app/desktop/src-tauri/${{ matrix.bundle }}/appimage/*.AppImage
            app/desktop/src-tauri/${{ matrix.bundle }}/appimage/*.AppImage.sig
            app/desktop/src-tauri/${{ matrix.bundle }}/rpm/*.rpm

      # ── Publish installers to the GitHub Release (tag pushes only) ──
      # GoReleaser (release.yml) creates the release and owns its notes; this
      # step waits for that release to exist, then appends this platform's
      # installers. Each matrix leg uploads only the files it built. Filenames
      # don't collide with GoReleaser's TUI tarballs, so they coexist.
      - name: Publish installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Wait (up to ~5 min) for GoReleaser to create the release so we never
          # race it for ownership of the tag.
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG exists"; break
            fi
            echo "waiting for release $TAG ($i/30)…"; sleep 10
          done
          shopt -s nullglob
          files=(
            app/desktop/src-tauri/${{ matrix.bundle }}/dmg/*.dmg
            app/desktop/src-tauri/${{ matrix.bundle }}/nsis/*.exe
            app/desktop/src-tauri/${{ matrix.bundle }}/msi/*.msi
            app/desktop/src-tauri/${{ matrix.bundle }}/appimage/*.AppImage
            app/desktop/src-tauri/${{ matrix.bundle }}/deb/*.deb
            app/desktop/src-tauri/${{ matrix.bundle }}/rpm/*.rpm
            # The macOS updater bundle. latest.json derives its URL from the
            # .sig filename, and this was never uploaded, so every macOS
            # update attempt resolved to a 404. Windows and Linux were fine
            # because their updater artifact IS the installer.
            app/desktop/src-tauri/${{ matrix.bundle }}/macos/*.app.tar.gz
            # Updater signatures: only present when signing is configured
            # (see the "Build Tauri app" step). latest.json (built by the
            # publish-updater-manifest job below) embeds their contents
            # directly, but publishing the raw .sig files too makes them easy
            # to spot-check on the release page.
            app/desktop/src-tauri/${{ matrix.bundle }}/macos/*.app.tar.gz.sig
            app/desktop/src-tauri/${{ matrix.bundle }}/nsis/*.exe.sig
            app/desktop/src-tauri/${{ matrix.bundle }}/msi/*.msi.sig
            app/desktop/src-tauri/${{ matrix.bundle }}/appimage/*.AppImage.sig
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer files found for this platform"; exit 0
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

          # Version-less aliases. Every bundler name embeds the version
          # (zcrypt_0.1.4_aarch64.dmg), so none of them can be fetched from a
          # stable /releases/latest/download/<name> URL, the download page,
          # the docs and install scripts all had to know the version. Upload a
          # second copy of each under a fixed name (the same trick the Android
          # job already uses for zcrypt.apk) so one URL per platform keeps
          # working across releases. Identical bytes, --clobber replaces.
          alias_for() {
            case "$1" in
              *_aarch64.dmg)    echo zcrypt-macos-arm64.dmg ;;
              *_x64.dmg)        echo zcrypt-macos-x64.dmg ;;
              *-setup.exe)      echo zcrypt-windows-x64-setup.exe ;;
              *.msi)            echo zcrypt-windows-x64.msi ;;
              *.AppImage)       echo zcrypt-linux-amd64.AppImage ;;
              *.deb)            echo zcrypt-linux-amd64.deb ;;
              *.rpm)            echo zcrypt-linux-x86_64.rpm ;;
              *)                echo "" ;;
            esac
          }
          aliasdir=$(mktemp -d)
          aliases=()
          for f in "${files[@]}"; do
            name=$(alias_for "$f")
            [ -z "$name" ] && continue   # .sig files and anything unmapped
            cp "$f" "$aliasdir/$name"
            aliases+=("$aliasdir/$name")
          done
          if [ ${#aliases[@]} -gt 0 ]; then
            printf 'alias: %s\n' "${aliases[@]}"
            gh release upload "$TAG" "${aliases[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi

  # ── Gate: is updater signing configured? ─────────────────────────────────────
  # The `secrets` context isn't available in `jobs.<job_id>.if` (only in `env:`
  # blocks), so we can't write `if: secrets.X != ''` directly on the job below.
  # This tiny job reads the secret through `env:` (which *does* have `secrets`)
  # and republishes it as a job output, which `if:` *can* read via `needs`.
  check-updater-signing:
    name: Check updater signing secret
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for TAURI_SIGNING_PRIVATE_KEY
        id: check
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Updater manifest (tag pushes, signing configured only) ──────────────────
  # Builds the Tauri updater's latest.json from each platform's .sig sidecar
  # (uploaded as part of the build-desktop matrix above) and attaches it to the
  # release, so the desktop app's built-in updater has something to poll.
  #
  # Fully gated on TAURI_SIGNING_PRIVATE_KEY (via check-updater-signing above):
  # if it isn't set, this job, and therefore the whole updater-manifest step:
  # is skipped and the release is published exactly as it is today (installers,
  # no latest.json). It also self-skips (see "Build updater manifest" below) if
  # the secret is set but tauri.conf.json's `plugins.updater` /
  # `bundle.createUpdaterArtifacts` haven't been configured yet, since in that
  # case `cargo tauri build` never actually produced any .sig files to work with.
  publish-updater-manifest:
    name: Publish updater manifest
    needs: [build-desktop, check-updater-signing]
    if: startsWith(github.ref, 'refs/tags/v') && needs.check-updater-signing.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download platform build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zcrypt-*
          path: artifacts

      - name: Build updater manifest (latest.json)
        id: manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          json=$(jq -n --arg v "$VER" --arg d "$PUB_DATE" \
            '{version: $v, notes: "See the GitHub release notes for details.", pub_date: $d, platforms: {}}')

          shopt -s nullglob
          for dir in artifacts/zcrypt-*; do
            name="$(basename "$dir")"
            # Artifact names are "zcrypt-<os>-<rust-target-triple>" (set by the
            # build-desktop matrix above), e.g. zcrypt-macos-aarch64-apple-darwin,
            # zcrypt-windows-x86_64-pc-windows-msvc. Map the triple to the
            # target key the Tauri updater expects (OS-ARCH).
            case "$name" in
              *aarch64-apple-darwin) platform="darwin-aarch64" ;;
              *x86_64-apple-darwin) platform="darwin-x86_64" ;;
              *x86_64-pc-windows-msvc) platform="windows-x86_64" ;;
              *x86_64-unknown-linux-gnu) platform="linux-x86_64" ;;
              *) echo "no updater platform mapping for '$name', skipping"; continue ;;
            esac

            sig_file="$(find "$dir" -name '*.sig' | head -n1)"
            if [ -z "$sig_file" ]; then
              echo "no .sig in $dir, skipping $platform"; continue
            fi

            bundle_name="$(basename "${sig_file%.sig}")"
            url="https://github.com/${REPO}/releases/download/${TAG}/${bundle_name}"
            signature="$(cat "$sig_file")"

            json=$(echo "$json" | jq --arg p "$platform" --arg u "$url" --arg s "$signature" \
              '.platforms[$p] = {url: $u, signature: $s}')
          done

          count="$(echo "$json" | jq '.platforms | length')"
          if [ "$count" -eq 0 ]; then
            echo "no signed updater artifacts found in any platform: tauri.conf.json's updater plugin is probably not configured yet; skipping latest.json"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$json" | jq . > latest.json
            cat latest.json
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish latest.json to release
        if: steps.manifest.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # ── Gate: is Android release signing configured? ────────────────────────────
  # Same pattern as check-updater-signing above (secrets aren't readable in
  # `if:` directly, so a tiny job republishes the check as an output).
  check-android-signing:
    name: Check Android signing secret
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for ANDROID_KEY_BASE64
        id: check
        env:
          KEY: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: Build Android APK
    needs: [build-frontend, check-android-signing]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # ── Toolchains ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 only: every real Android phone since ~2019 is aarch64. Skipping
          # armv7 (ancient 32-bit) + x86/x86_64 (emulators) cuts the build ~4x and
          # still sideloads on any modern device. Add the others back for Play.
          # All Android ABIs → one universal APK that installs on every device
          # (arm64 = modern phones, armv7 = old 32-bit, x86/x86_64 = emulators).
          # No per-phone builds; the single APK carries a native lib for each.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/desktop/src-tauri
            app/core

      - uses: oven-sh/setup-bun@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Download frontend-dist artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: app/desktop/frontend-dist

      # Stamp the bundle version. Unlike build-desktop, this must ALSO run off
      # a tag: the rolling android-latest APK below is published on every push
      # to main, so gating this on refs/tags/v meant every sideload build
      # shipped tauri.conf.json's literal placeholder ("0.1.0") as its
      # versionName, no matter how far ahead of v0.1.0 it actually was.
      # Off a tag we stamp <conf version>-dev.<short sha>, which is honest
      # about being a rolling build and still sorts under the next release.
      - name: Set version
        shell: bash
        run: |
          cd app/desktop/src-tauri
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            BASE=$(jq -r '.version' tauri.conf.json)
            VER="${BASE}-dev.${GITHUB_SHA::7}"
          fi
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' tauri.conf.json > "$tmp" && mv "$tmp" tauri.conf.json
          echo "tauri version set to $VER"

      # ── Tauri CLI ──
      # Same cache as build-desktop's ubuntu-22.04 leg: this job also runs on
      # ubuntu-22.04, so it's the SAME OS+arch key and genuinely reuses that
      # leg's cached binary instead of compiling its own copy.
      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # `android init` generates gen/android/ from tauri.conf.json + the Rust
      # crate. It isn't committed to the repo (app/desktop/src-tauri/gen only
      # ships the desktop `schemas/` dir), so every CI run (re)creates it from
      # scratch, same as a fresh clone would: including the Tauri CLI's own
      # template launcher icons.
      - name: Initialize Android project
        working-directory: app/desktop/src-tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android init

      # The safe-area CSS (globals.css --safe-*) is only worth anything if the
      # activity actually draws under the status/navigation bars. It does, via
      # two independent mechanisms: the CLI's MainActivity template calls
      # enableEdgeToEdge(), and targetSdk 36 means Android 15+ enforces
      # edge-to-edge regardless. Both come from a generated file nobody reviews,
      # so assert them rather than assume them, if a future CLI drops either,
      # every inset silently reads 0 and the app quietly re-gains the notch bug.
      - name: Assert Android draws edge-to-edge
        working-directory: app/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          # The CLI relocates the activity into its package directory
          # (app/src/main/java/app/zcrypt/desktop/), so find it rather than
          # hardcoding a path that moves with the identifier.
          MA=$(find gen/android/app/src/main -name MainActivity.kt | head -1)
          [ -n "$MA" ] \
            || { echo "::error::no MainActivity.kt under gen/android/app/src/main: 'android init' did not generate what we expect."; exit 1; }
          echo "activity: $MA"
          grep -q 'enableEdgeToEdge()' "$MA" \
            || { echo "::error::$MA no longer calls enableEdgeToEdge(): safe-area insets will be 0 on Android 14 and below."; exit 1; }
          grep -q ': TauriActivity(' "$MA" \
            || { echo "::error::$MA no longer extends TauriActivity: the inset-injection step below is written against that base class."; exit 1; }
          grep -qE 'targetSdk *= *3[5-9]' gen/android/app/build.gradle.kts \
            || { echo "::error::generated targetSdk dropped below 35. Android no longer enforces edge-to-edge."; exit 1; }
          echo "edge-to-edge OK"

      # Drawing edge-to-edge is necessary but not sufficient: the WebView also
      # has to forward the window insets into env(safe-area-inset-*), and that
      # support is gated on the Android System WebView's own version. Our
      # MainActivity publishes them as CSS variables so a stale WebView can't
      # silently zero every inset. Rationale in full lives in that file.
      - name: Publish Android window insets to CSS
        working-directory: app/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          SRC=android/MainActivity.kt
          PKG=$(jq -r '.identifier' tauri.conf.json)
          grep -qx "package $PKG" "$SRC" \
            || { echo "::error::$SRC declares a different package than tauri.conf.json's identifier ($PKG). Android would not find the activity."; exit 1; }
          DEST=$(find gen/android/app/src/main -name MainActivity.kt | head -1)
          [ -n "$DEST" ] \
            || { echo "::error::no generated MainActivity.kt to replace."; exit 1; }
          cp "$SRC" "$DEST"
          echo "MainActivity replaced from $SRC -> $DEST"

      # MUST run AFTER `android init`, not before. `tauri icon` picks its
      # Android output dir by probing for gen/android/app/src/main/res: if that
      # exists it writes the mipmaps straight into the real project, and if it
      # doesn't it falls back to staging them in icons/android/, which
      # `android init` never reads back. Running this first (as it was) meant
      # the staged icons were silently discarded and every APK shipped Tauri's
      # template logo. Desktop bundle icons (tauri.conf.json's `bundle.icon`)
      # are regenerated from the same source and are unaffected.
      - name: Generate app icons for Android
        working-directory: app/desktop/src-tauri
        run: cargo tauri icon icons/icon.png

      # The icon path above is silent when it goes wrong, a wrong-order or
      # renamed-source regression would just ship the Tauri logo again. Fail
      # the build instead: the generated launcher icon must exist and must not
      # be byte-identical to the CLI's template.
      - name: Verify the Android launcher icon is ours
        working-directory: app/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          ICON=gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          if [ ! -f "$ICON" ]; then
            echo "::error::$ICON is missing: 'tauri icon' did not write into gen/android."
            exit 1
          fi
          TEMPLATE=$(find ~/.cargo -path '*tauri-cli*' -name 'ic_launcher.png' -path '*xxxhdpi*' 2>/dev/null | head -1)
          if [ -n "$TEMPLATE" ] && cmp -s "$ICON" "$TEMPLATE"; then
            echo "::error::Launcher icon is byte-identical to the Tauri template: the zcrypt icon was not applied."
            exit 1
          fi
          echo "launcher icon OK: $(wc -c < "$ICON") bytes"

      # ── Optional release signing ──
      # If ANDROID_KEY_BASE64 (a base64-encoded .jks keystore) plus its alias
      # and passwords are configured as repo secrets, sign the release APK.
      # Without them, `android build` still succeeds. It just produces a
      # debug-signed APK, which is fine for the workflow-artifact/internal
      # testing use case but NOT for a Play Store submission. See blocked_on.
      #
      # One-time human setup to turn this on:
      #   keytool -genkey -v -keystore zcrypt-release.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias zcrypt
      #   Add repo secrets: ANDROID_KEY_BASE64 (base64 of the .jks file),
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Always produce a keystore.properties so the RELEASE apk is signed (an
      # unsigned release apk is rejected by Android as "package appears to be
      # invalid"). Prefer the persistent release keystore from secrets; if none
      # is set, generate an EPHEMERAL keystore here with keytool (the JDK is
      # already installed above): enough to sideload for testing. Caveat: a
      # fresh key each run means updates can't install OVER a previous install
      # (uninstall first); add ANDROID_KEY_BASE64/ALIAS/PASSWORD for a persistent
      # key when you want update-over-install + Play.
      - name: Configure Android signing (persistent secret, else ephemeral)
        working-directory: app/desktop/src-tauri/gen/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEY_BASE64}" ]; then
            echo "Signing with the configured persistent release keystore."
            echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
            echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
            base64 -d <<< "${ANDROID_KEY_BASE64}" > "$RUNNER_TEMP/zcrypt-release.jks"
            alias="${ANDROID_KEY_ALIAS}"; pass="${ANDROID_KEY_PASSWORD}"
          else
            echo "No release keystore secret: generating an ephemeral one so the"
            echo "release APK is signed + sideloadable (see the step comment)."
            keytool -genkeypair -v -noprompt \
              -keystore "$RUNNER_TEMP/zcrypt-release.jks" \
              -alias zcrypt -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass zcryptci -keypass zcryptci \
              -dname "CN=zcrypt, O=zcrypt, C=PK"
            echo "keyAlias=zcrypt" > keystore.properties
            echo "password=zcryptci" >> keystore.properties
            alias="zcrypt"; pass="zcryptci"
          fi
          echo "storeFile=$RUNNER_TEMP/zcrypt-release.jks" >> keystore.properties

          # Export the key coordinates for the explicit apksigner step below.
          # Tauri's generated Gradle does NOT reliably consume keystore.properties,
          # so we sign the built APK ourselves (deterministic + verifiable) rather
          # than trust the build to do it.
          {
            echo "SIGN_KEYSTORE=$RUNNER_TEMP/zcrypt-release.jks"
            echo "SIGN_ALIAS=$alias"
            echo "SIGN_PASS=$pass"
          } >> "$GITHUB_ENV"

      - name: Build Android APK
        working-directory: app/desktop/src-tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        # RELEASE, all-ABI universal APK. Release (not --debug) keeps it ~100MB
        # instead of ~200MB+; no --target = one universal APK for every device
        # (arm64/armv7/x86/x86_64). This emits an UNSIGNED release APK, the
        # explicit apksigner step below makes it installable.
        run: cargo tauri android build --apk

      # ── Sign + verify the release APK ──
      # Tauri's generated Gradle does not reliably apply keystore.properties, so
      # the release APK comes out unsigned and Android rejects it with "package
      # appears to be invalid". We sign it ourselves with the SDK's apksigner
      # (zipalign first, as the tooling expects), then apksigner verify, so an
      # unsigned/broken APK fails the build instead of shipping uninstallable.
      # The signed APK path is exported as $SIGNED_APK for the publish steps.
      - name: Sign + verify the release APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          apk_dir="app/desktop/src-tauri/gen/android/app/build/outputs/apk"
          # Prefer the universal release APK; fall back to any release APK.
          cands=("$apk_dir"/**/release/*universal*.apk "$apk_dir"/**/release/*.apk)
          src=""
          for f in "${cands[@]}"; do [ -f "$f" ] && { src="$f"; break; }; done
          if [ -z "$src" ]; then
            echo "::error::no release APK found under $apk_dir"; ls -R "$apk_dir" || true; exit 1
          fi
          echo "signing: $src"

          # Newest installed build-tools has zipalign + apksigner.
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools: $bt"

          out="$RUNNER_TEMP/zcrypt.apk"
          "${bt}zipalign" -f -p 4 "$src" "$RUNNER_TEMP/zcrypt-aligned.apk"
          "${bt}apksigner" sign \
            --ks "$SIGN_KEYSTORE" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out "$out" "$RUNNER_TEMP/zcrypt-aligned.apk"

          # Hard gate: a bad signature fails the build here, not on the phone.
          "${bt}apksigner" verify --verbose "$out"
          ls -la "$out"
          echo "SIGNED_APK=$out" >> "$GITHUB_ENV"

      # ── Upload artifact ──
      # The signed, verified APK from the step above (not the raw Gradle output,
      # which is unsigned and won't install).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: zcrypt-android-apk
          path: ${{ runner.temp }}/zcrypt.apk
          if-no-files-found: error

      # ── Publish APK to the GitHub Release (tag pushes only) ──
      # Same pattern as build-desktop: GoReleaser (release.yml) creates the
      # release; this step waits for it, then appends the APK.
      - name: Publish APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG exists"; break
            fi
            echo "waiting for release $TAG ($i/30)…"; sleep 10
          done
          # The signed + verified APK from the sign step.
          echo "uploading: $SIGNED_APK"
          gh release upload "$TAG" "$SIGNED_APK" --repo "$GITHUB_REPOSITORY" --clobber

      # ── Publish a rolling sideload build (android-latest) ──
      # /download on the site links to a single stable URL for the APK:
      #   https://github.com/Wosmos/zcrypt/releases/download/android-latest/zcrypt.apk
      # This is a separate, non-versioned prerelease from the tag-based
      # release above: it exists purely so that link never breaks, and it's
      # refreshed on every push that touches desktop/core (not just version
      # tags). The APK is signed (persistent keystore if configured, else an
      # ephemeral CI key) so it installs; it's just not Play-Store-eligible.
      # Skipped on pull_request builds (untrusted forks don't get a token with
      # write access, and PR builds shouldn't clobber the public link anyway).
      - name: Publish rolling sideload APK (android-latest)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # $SIGNED_APK is the signed + verified $RUNNER_TEMP/zcrypt.apk, already
          # the exact asset name /download links to, so no copy/rename needed.
          echo "publishing: $SIGNED_APK"

          if ! gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "zcrypt for Android (sideload build)" \
              --notes "Rolling build for sideloading: updated automatically on every push to main, always tracks the latest commit. Not signed for the Play Store; Android will warn the APK is from an unknown developer, which is expected when installing outside the Play Store." \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release edit android-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          fi

          gh release upload android-latest "$SIGNED_APK" \
            --repo "$GITHUB_REPOSITORY" --clobber
