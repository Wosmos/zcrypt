name: Reindex Nudge

# After a marketing/content deploy, submit the sitemap to every IndexNow engine
# (Bing, Yandex, Seznam, Naver). Fails when none of them accepts it. Google has
# no instant-reindex API; it reads the sitemap from Search Console. See
# scripts/reindex-search-engines.sh.
#
# Optional secret: NTFY_TOPIC (same topic used by neon-watch.yml) to also
# get a phone push with the result.

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/app/**"
      - "app/frontend/public/**"
      - "app/frontend/lib/data.ts"
  workflow_dispatch:

jobs:
  reindex:
    name: Nudge search engines to recrawl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Vercel deploy to land
        run: sleep 60

      - name: Ping search engines
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash scripts/reindex-search-engines.sh
