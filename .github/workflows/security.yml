name: Security Scan

# Dependency CVE scanning doesn't need to run on every push: a new
# vulnerability shows up because of an upstream advisory, not because of your
# own commit. It runs weekly for new advisories, and on any push that changes a
# dependency manifest or lockfile, since that is the moment a commit CAN bring
# one in. Tool versions are pinned so a scanner release can't change the verdict.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "app/backend/go.mod"
      - "app/backend/go.sum"
      - "app/frontend/package.json"
      - "app/frontend/bun.lock"
      - "app/core/Cargo.toml"
      - "app/core/Cargo.lock"
      - "app/desktop/src-tauri/Cargo.toml"
      - "app/desktop/src-tauri/Cargo.lock"
      - "app/desktop/src-tauri/deny.toml"
      - ".github/workflows/security.yml"

jobs:
  govulncheck:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check backend vulnerabilities
        working-directory: app/backend
        run: govulncheck ./...

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, gitleaks needs it for a whole-repo sweep

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # Full-history sweep: the backstop for whatever the diff-scoped prepush
      # check (scripts/prepush.sh) can't see, e.g. a secret that landed before
      # this check existed. Known placeholder/test-fixture matches are
      # allowlisted by fingerprint in .gitleaksignore (metadata only, never raw
      # secret values). Blocking: a finding means rotate the secret, then
      # allowlist that fingerprint once it is dead.
      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner --redact -v

  bun-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile

      # Fails on high and critical advisories; moderate and low are printed by
      # the full report below but don't block.
      - name: Audit (high and above)
        working-directory: app/frontend
        run: bun audit --audit-level=high

      - name: Full report
        if: always()
        working-directory: app/frontend
        run: bun audit || true

  cargo-deny:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - app/core/Cargo.toml
          - app/desktop/src-tauri/Cargo.toml
    steps:
      - uses: actions/checkout@v7

      # RustSec advisories (known CVEs, yanked and unsound crates) for the
      # shared core and the desktop/Android shell that embeds it. Advisories
      # that only Tauri's own dependencies can fix are ignored by ID, each with
      # its reason, in app/desktop/src-tauri/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories
