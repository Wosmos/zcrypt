name: Security Scan

# govulncheck (Go dependency CVE scanning) doesn't need to run on every push:
# a new vulnerability shows up because of an upstream advisory, not because of
# your own commit, so checking on every push just re-ran the same scan for no
# new information. Weekly + on-demand catches new advisories just as fast in
# practice while cutting this from N-times-a-day to once a week.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  govulncheck:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check backend vulnerabilities
        working-directory: app/backend
        run: govulncheck ./...

      - name: Check TUI vulnerabilities
        working-directory: app/tui
        run: govulncheck ./...

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, gitleaks needs it for a whole-repo sweep

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # Full-repo, working-tree sweep: the periodic backstop for whatever the
      # diff-scoped prepush check (scripts/prepush.sh) can't see, e.g. a secret
      # that landed before this check existed. Known placeholder/test-fixture
      # matches are allowlisted by fingerprint in .gitleaksignore (metadata
      # only, never raw secret values). Advisory only for now: a real finding
      # means rotate + clean history, not something CI should auto-block until
      # a clean baseline is established and this job is deliberately promoted.
      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner -v
        continue-on-error: true
