name: Deploy Website

# Builds the website as a Cloudflare Worker (vinext) and deploys it. CI calls
# this after a frontend change lands on main. Run it by hand after changing a
# NEXT_PUBLIC_* repository variable, e.g. when scripts/railway-flip.sh moves
# the backend, since those values are baked into the bundle at build time.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Frontend (Cloudflare)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile

      - name: Build the Worker (vinext)
        working-directory: app/frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build:vinext

      # ZCRYPT_PROXY_SECRET and RELEASE_HOOK_SECRET are Worker secrets set once in Cloudflare, never here.
      - name: Deploy to Cloudflare Workers
        working-directory: app/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:vinext -- --skip-build

  reindex:
    needs: deploy
    uses: ./.github/workflows/reindex.yml
    secrets: inherit
