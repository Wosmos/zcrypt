# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_usernames:
      - dependabot[bot]
  path_filters:
    - "!**/bun.lock"
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
    - "!**/go.sum"
    - "!app/frontend/messages/**"
    - "!app/desktop/src-tauri/gen/**"
    - "!**/*.snap"
    - "!docs/neon-manifest.json"
chat:
  auto_reply: true
